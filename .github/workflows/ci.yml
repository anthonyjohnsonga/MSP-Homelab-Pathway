# Validate, test and build on every push and pull request.
#
# The curriculum invariants are checked here, not just locally: a forward
# dependency or a gap in the calendar produces a platform that quietly misleads
# techs about what they can start, so it has to fail the build.
#
# No Azure and no secrets are involved. Deployment is a separate workflow that
# lands when the Azure build begins.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only ever reads the repo.
permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the floor: below it, Node cannot run the TypeScript test
        # files without a build step. 24 is what development happens on.
        node: ['22.18.0', '24']

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate curriculum invariants
        run: npm run validate

      - name: Test
        run: npm test

      - name: Typecheck shared
        run: npm run build --workspace @pathway/shared

      - name: Build web
        run: npm run build --workspace @pathway/web

      - name: Assert no secrets in the built bundle
        # Cheap backstop for the rule that this repo carries no secrets. Not a
        # substitute for scanning, but it catches a connection string pasted
        # into source and shipped to a public site.
        run: |
          if grep -rEl 'AccountKey=|client_secret|-----BEGIN [A-Z ]*PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{20,}' web/dist; then
            echo "::error::Possible secret found in the built bundle"
            exit 1
          fi
          echo "No secret patterns found in web/dist"
